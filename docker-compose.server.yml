services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.selfhost
    restart: unless-stopped
    environment:
      PLATFORM_CREDENTIALS_KEY: ${PLATFORM_CREDENTIALS_KEY:?PLATFORM_CREDENTIALS_KEY is required}
      HAIXIN_GATEWAY_ADMIN_SECRET: ${HAIXIN_GATEWAY_ADMIN_SECRET:?HAIXIN_GATEWAY_ADMIN_SECRET is required}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:?DEFAULT_ADMIN_USERNAME is required}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?DEFAULT_ADMIN_PASSWORD is required}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://claudecc.top}
      MODEL_NAME: ${MODEL_NAME:-gpt-5.5}
      MODEL_RELAY_URL: http://model-relay:8789/v1/chat/completions
      COLLECTOR_PROXY_URL: http://model-relay:8789/collector/fetch
      # 发信：app 只需 MAIL_HOST/MAIL_SENDER 用于「是否已配置」的门槛与后台状态展示，
      # 真正的发信密钥（MAIL_PASS）只给网关，不进 worker。
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_SENDER: ${MAIL_USER:-}
    volumes:
      - haixin_app_data:/data
    expose:
      - "3000"
    depends_on:
      - model-relay

  model-relay:
    build:
      context: ./services/model-relay
    restart: unless-stopped
    expose:
      - "8789"

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx-ip.conf:/etc/nginx/conf.d/default.conf:ro

  channel-gateway:
    build:
      context: ./services/channel-gateway
    restart: unless-stopped
    depends_on:
      - app
    environment:
      HAIXIN_ACCOUNTS_JSON: ${HAIXIN_ACCOUNTS_JSON:-[]}
      HAIXIN_GATEWAY_ACCOUNTS_URL: http://app:3000/api/gateway/accounts
      HAIXIN_GATEWAY_ADMIN_SECRET: ${HAIXIN_GATEWAY_ADMIN_SECRET:?HAIXIN_GATEWAY_ADMIN_SECRET is required}
      PORT: "8788"
      # 发信凭据只落在网关：网关消费 mail_outbox，用 node:tls 直连 SMTP 投出验证码邮件。
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
    expose:
      - "8788"

volumes:
  haixin_app_data:
